<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body
    class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center font-sans text-slate-100">


    <div
        class="bg-slate-900/85 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-700/50 w-full max-w-md mx-4">
        <h2 class="text-2xl font-bold mb-6 text-center text-sky-400">Data Validation Form</h2>

        <form id="checkForm" class="space-y-5" novalidate>
            <!-- حقل الاسم -->
            <div>
                <label for="name" class="block text-sm font-medium mb-2 text-slate-300">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name here" required
                    class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-slate-100 placeholder-slate-500 transition-all">
            </div>

            <!-- حقل البريد الإلكتروني -->
            <div>
                <label for="email" class="block text-sm font-medium mb-2 text-slate-300">Email Address (Gmail)</label>
                <input type="text" id="email" placeholder="example@gmail.com" required
                    class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-slate-100 placeholder-slate-500 transition-all">

                
                <div id="resultBox" class="mt-3 p-3 rounded-xl text-center font-medium hidden transition-all"></div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit"
                class="w-full py-3 bg-sky-600 hover:bg-sky-500 active:scale-[0.98] font-semibold rounded-xl shadow-lg shadow-sky-600/20 transition-all cursor-pointer">
                Submit Data
            </button>
        </form>
        <script src="script.js"></script>
</body>

</html>
